name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check placeholder images
        id: images
        run: |
          if [ -f src/assets/images/hero-800.webp ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.images.outputs.missing == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate placeholder images and commit them
        if: steps.images.outputs.missing == 'true'
        run: |
          pip install --quiet pillow
          python scripts/generate-placeholders.py /tmp/velora-source public/og-image.jpg
          IMAGES_SRC=/tmp/velora-source node scripts/optimize-images.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/images public/og-image.jpg
          git commit -m "chore: add generated placeholder images [skip ci]"
          git push

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build --base=/velora-flowers/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
